[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "grant-opportunity-matcher"
version = "1.0.0"
description = "Match nonprofit profiles to live federal grant opportunities from Grants.gov"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Damarius McNair", email = "damarius1234@gmail.com" }]

dependencies = [
    "streamlit>=1.32.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25.0,<1.0.0"]
openai    = ["openai>=1.0.0,<2.0.0"]
groq      = ["groq>=0.4.0,<1.0.0"]
all-ai    = [
    "anthropic>=0.25.0,<1.0.0",
    "openai>=1.0.0,<2.0.0",
    "groq>=0.4.0,<1.0.0",
]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
